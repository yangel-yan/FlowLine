app:
  id: "7695994290714984511"
  name: FlowLine
  slogan: 一款面向 PICO XR 的单人沉浸式滑雪游戏
  description: |-
    
    在雪山中压刃、蓄力、起跳与抓板，用连续动作维持 FLOW，完成属于自己的高速滑行路线。

    《FLOWLINE》是一款面向 PICO XR 的单人沉浸式滑雪游戏。玩家以第三人称视角穿越高山、雪松林和冰川雪道，通过压刃转向、蓄力起跳、空中抓板和稳定落地积累 FLOW，在旗门、竞速与自由技巧挑战中刷新个人最佳成绩。

    ## 核心特色

    - 六条程序化雪山路线，覆盖高山、森林与冰川主题。
    - FLOW、旗门竞速、自由滑行三种玩法模式。
    - 压刃、蓄力、起跳、抓板、旋转、栏杆和连击评分。
    - 奖牌、路线解锁、服装与滑板外观成长。
    - 本地个人最佳轨迹回放与成绩记录。
    - 第三人称舒适视角，支持坐姿、站姿和多档舒适设置。
    - 左右手柄射线菜单与中英文界面。
